<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genome Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=4">
    <link rel="stylesheet" href="css/dna.css?v=4">
</head>
<body>
    <header class="site-header site-header-genome">
        <div class="shell">
            <div class="brand">
                <div class="brand-mark">G</div>
                <div>
                    <h1>Genome Analyzer</h1>
                    <p>Learning Assistant</p>
                </div>
            </div>
            <div class="status-pill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
        <nav class="site-nav shell" aria-label="Main">
            <a href="/" class="nav-pill">
                <span class="nav-icon notes">B</span>
                Book Notes
            </a>
            <a href="/dna.html" class="nav-pill active">
                <span class="nav-icon genome">G</span>
                Genome Analyzer
            </a>
        </nav>
    </header>

    <section class="hero-band hero-band-genome">
        <div class="shell">
            <p class="hero-tag">DNA lab</p>
            <h2 class="hero-headline">Paste a sequence. See what it’s made of.</h2>
        </div>
    </section>

    <section class="zone zone-genome">
        <div class="shell zone-head">
            <div>
                <span class="zone-label">🧬 Analyze</span>
                <h3>Sequence tools</h3>
                <p class="zone-sub">Valid bases: A, T, G, C — up to 1,000 characters</p>
            </div>
        </div>
        <div class="shell compose-panel genome-panel">
            <div class="form-group">
                <label for="dnaInput">DNA sequence</label>
                <textarea
                    id="dnaInput"
                    class="dna-input"
                    placeholder="Enter A, T, G, C only — e.g. ATGC"
                    maxlength="1000"
                    spellcheck="false"
                ></textarea>
                <div class="field-footer">
                    <button type="button" class="btn-text" id="dnaExampleBtn">Load example</button>
                    <span class="char-count" id="dnaCharCount">0/1000</span>
                </div>
            </div>
            <button class="btn-save btn-genome" id="dnaAnalyzeBtn" onclick="analyzeDna()">Analyze sequence</button>

            <div class="dna-results" id="dnaResults" hidden>
                <div class="dna-stats-row">
                    <div class="dna-stat">
                        <p class="result-label">Length</p>
                        <p class="dna-stat-value" id="dnaLength">—</p>
                    </div>
                    <div class="dna-stat">
                        <p class="result-label">GC content</p>
                        <p class="dna-stat-value" id="gcPercent">—</p>
                    </div>
                </div>
                <div class="gc-bar" aria-hidden="true">
                    <div class="gc-bar-fill" id="gcBarFill"></div>
                </div>
                <div class="dna-result-block">
                    <p class="result-label">Reverse complement</p>
                    <p class="dna-sequence" id="reverseComplement"></p>
                </div>
                <div class="dna-result-block">
                    <p class="result-label">Nucleotide counts</p>
                    <ul class="nucleotide-count-list" id="nucleotideCounts"></ul>
                </div>
            </div>

            <p class="dna-error" id="dnaError" hidden></p>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <script src="js/dna.js"></script>
</body>
</html>
