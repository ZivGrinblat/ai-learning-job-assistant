<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #080b14;
            color: #c9d1d9;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            border-bottom: 1px solid #21262d;
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        .header-inner {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f0f6fc;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: #484f58;
            background: #0d1117;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid #21262d;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #da3633;
            transition: background 0.3s;
        }

        .status-dot.online {
            background: #3fb950;
            box-shadow: 0 0 6px rgba(63, 185, 80, 0.4);
        }

        .main {
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        .card {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: -0.01em;
        }

        .badge {
            font-size: 0.7rem;
            background: #1f2937;
            color: #8b949e;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-weight: 500;
        }

        .card-body {
            padding: 1.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .form-group.grow {
            flex: 1;
        }

        .form-group.shrink {
            flex: 0 0 80px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input, textarea {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #388bfd;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
        }

        input::placeholder, textarea::placeholder {
            color: #484f58;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .field-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
        }

        .char-count {
            font-size: 0.7rem;
            color: #484f58;
            font-variant-numeric: tabular-nums;
        }

        .char-count.warn { color: #d29922; }
        .char-count.over { color: #da3633; }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.65rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .shortcut-hint {
            text-align: center;
            font-size: 0.7rem;
            color: #484f58;
            margin-top: 0.5rem;
        }

        .shortcut-hint kbd {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.65rem;
        }

        .notes-panel {
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .notes-scroll {
            overflow-y: auto;
            padding: 0.75rem;
            flex: 1;
        }

        .notes-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .notes-scroll::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .note-item {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.6rem;
            transition: border-color 0.2s;
            position: relative;
        }

        .note-item:hover {
            border-color: #30363d;
        }

        .note-item:last-child {
            margin-bottom: 0;
        }

        .note-book {
            font-size: 0.7rem;
            font-weight: 600;
            color: #8b5cf6;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.15rem;
        }

        .note-chapter {
            font-size: 0.7rem;
            color: #484f58;
            margin-bottom: 0.4rem;
        }

        .note-text {
            font-size: 0.85rem;
            line-height: 1.55;
            color: #c9d1d9;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .note-date {
            font-size: 0.65rem;
            color: #484f58;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #484f58;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-delete:hover {
            color: #da3633;
            background: rgba(218, 54, 51, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #484f58;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .empty-state .empty-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            opacity: 0.4;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #1f2937;
            color: #f0f6fc;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            border-left: 3px solid #3fb950;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .toast.error {
            border-left-color: #da3633;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .library-section {
            max-width: 860px;
            margin: 0 auto;
            padding: 1.5rem 2rem 0;
        }

        .book-library {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .book-chip {
            font-family: inherit;
            font-size: 0.78rem;
            padding: 0.45rem 0.75rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #c9d1d9;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .book-chip:hover {
            border-color: #388bfd;
            background: #1c2128;
        }

        .book-chip .count {
            color: #79c0ff;
            margin-left: 0.25rem;
        }

        @media (max-width: 768px) {
            .main {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .notes-panel {
                position: static;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">B</div>
                <h1>Book Notes</h1>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
    </div>

    <section class="library-section">
        <div class="card">
            <div class="card-header">
                <h2>Library</h2>
            </div>
            <div class="card-body">
                <div class="book-library" id="bookLibrary">Loading books...</div>
            </div>
        </div>
    </section>

    <div class="main">
        <div class="card">
            <div class="card-header">
                <h2>New Note</h2>
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group grow">
                        <label for="bookName">Book</label>
                        <input type="text" id="bookName" placeholder="The Muslim Jesus" maxlength="30" dir="auto">
                    </div>
                    <div class="form-group shrink">
                        <label for="chapter">Ch.</label>
                        <input type="number" id="chapter" placeholder="1" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="noteText">Your thought</label>
                    <textarea id="noteText" placeholder="What stood out? What connection did you notice?" maxlength="150" dir="auto"></textarea>
                    <div class="field-footer">
                        <span></span>
                        <span class="char-count" id="charCount">0/150</span>
                    </div>
                </div>
                <button class="btn-primary" id="saveBtn" onclick="saveNote()">Save Note</button>
                <div class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save</div>
            </div>
        </div>

        <div class="card notes-panel">
            <div class="card-header">
                <h2>Your Notes</h2>
                <span class="badge" id="noteCount">0</span>
            </div>
        
            <div class="card-body">
                <div class="form-group">
                    <label for="bookFilter">Filter by book</label>
                    <input 
                        type="text" 
                        id="bookFilter" 
                        placeholder="Type a book name" 
                        dir="auto"
                    >
                </div>
            </div>
        
            <div class="notes-scroll" id="notesList">
                <div class="empty-state">
                    <div class="empty-icon">B</div>
                    Loading...
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";


        async function checkHealth() {
            const dot = document.getElementById("statusDot");
            const text = document.getElementById("statusText");

            try {
                const res = await fetch(`${API_BASE}/health`);

                if (res.ok) {
                    dot.classList.add("online");
                    text.textContent = "Connected";
                }
            } catch {
                dot.classList.remove("online");
                text.textContent = "Offline";
            }
        }

        async function loadNoteCount() {
            const res = await fetch(`${API_BASE}/notes/count`);
            const data = await res.json();
            document.getElementById("noteCount").textContent = data.count;
        }
        

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "toast show" + (isError ? " error" : "");

            setTimeout(() => toast.classList.remove("show"), 2500);
        }


        async function saveNote() {
            const bookName = document.getElementById("bookName").value.trim();
            const chapter = parseInt(document.getElementById("chapter").value);
            const noteText = document.getElementById("noteText").value.trim();

            if (!bookName || !chapter || !noteText) {
                showToast("Fill in all fields", true);
                return;
            }

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const res = await fetch(`${API_BASE}/notes`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        book_name: bookName,
                        chapter_number: chapter,
                        note_text: noteText,
                    }),
                });

                if (res.ok) {
                    const data = await res.json();
                    showToast(`Saved — note #${data.id}`);
                    clearForm();
                    loadBooks();
                    loadNoteCount();
                    loadNotes();
                } else {
                    const err = await res.json();
                    showToast(err.detail?.[0]?.msg || "Save failed", true);
                }
            } catch {
                showToast("Could not reach API", true);
            }

            btn.disabled = false;
            btn.textContent = "Save Note";
        }

        async function deleteNote(id) {
            try {
                const res = await fetch(`${API_BASE}/notes/${id}`, { method: "DELETE" });

                if (res.ok) {
                    showToast("Note deleted");
                    loadBooks();
                    loadNoteCount();
                    loadNotes();
                } else {
                    showToast("Delete failed", true);
                }
            } catch {
                showToast("Could not reach API", true);
            }
        }

        async function loadBooks() {
            const container = document.getElementById("bookLibrary");

            try {
                const res = await fetch(`${API_BASE}/books`);
                const books = await res.json();

                if (books.length === 0) {
                    container.textContent = "No books yet — save a note to start your library.";
                    return;
                }

                container.innerHTML = "";
                for (const item of books) {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "book-chip";
                    btn.dir = "auto";
                    btn.innerHTML = `${escapeHtml(item.book)}<span class="count">${item.note_count}</span>`;
                    btn.addEventListener("click", () => {
                        document.getElementById("bookFilter").value = item.book;
                        loadNotes();
                    });
                    container.appendChild(btn);
                }
            } catch {
                container.textContent = "Could not load library.";
            }
        }

        async function loadNotes() {
            const container = document.getElementById("notesList");
            const badge = document.getElementById("noteCount");
            const bookFilter = document.getElementById("bookFilter").value.trim();
        
            let url = `${API_BASE}/notes`;
        
            if (bookFilter) {
                url += `?book=${encodeURIComponent(bookFilter)}`;
            }
        
            try {
                const res = await fetch(url);
                const notes = await res.json();
                
                if (notes.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">B</div>
                            No notes found.
                        </div>`;
                    return;
                }
        
                container.innerHTML = notes.map(note => `
                    <div class="note-item">
                        <div class="note-book" dir="auto">${escapeHtml(note.book)}</div>
                        <div class="note-chapter">Chapter ${note.chapter}</div>
                        <div class="note-text" dir="auto">${escapeHtml(note.note)}</div>
                        <div class="note-footer">
                            <span class="note-date">${formatDate(note.created_at)}</span>
                            <button class="btn-delete" onclick="deleteNote(${note.id})">delete</button>
                        </div>
                    </div>
                `).join("");
            } catch {
                container.innerHTML = '<div class="empty-state">Could not load notes.</div>';
                badge.textContent = "—";
            }
        }

        function clearForm() {
            document.getElementById("bookName").value = "";
            document.getElementById("chapter").value = "";
            document.getElementById("noteText").value = "";
            updateCharCount();
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + "Z");

            return d.toLocaleDateString("en-GB", {
                day: "numeric",
                month: "short",
                year: "numeric",
            }) + " " + d.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
            });
        }

        function updateCharCount() {
            const textarea = document.getElementById("noteText");
            const counter = document.getElementById("charCount");
            const len = textarea.value.length;

            counter.textContent = `${len}/150`;
            counter.className = "char-count" + (len > 140 ? " over" : len > 120 ? " warn" : "");
        }

        document.getElementById("noteText").addEventListener("input", updateCharCount);
        document.getElementById("bookFilter").addEventListener("input", loadNotes);

        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                saveNote();
            }
        });

        checkHealth();
        loadBooks();
        loadNoteCount();
        loadNotes();

    </script>
</body>
</html>
