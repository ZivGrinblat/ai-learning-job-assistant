        3. Put result in #output as text (JSON.stringify is fine)

        CHECK: Network tab shows 200, page shows {"status":"ok"}
        */

        async function pingApi() {
            const output = document.getElementById("output");

            // TODO: try/catch optional but recommended
            // TODO: const res = await fetch(...)
            // TODO: const data = await res.json()
            // TODO: output.textContent = ...
            // TODO: on success add class "ok" to output, on catch show error with class "fail"

            output.textContent = "Replace this line with your code.";
        }

        document.getElementById("pingBtn").addEventListener("click", pingApi);
    </script>

</html>
